services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    shm_size: 128mb
    # The imageembedding IVFFlat index (lists=1000, dimensions=3584) requires
    # ~350 MB to rebuild. This happens during test TRUNCATE, greenmask restores,
    # and any bulk reindex. The default maintenance_work_mem (64 MB) is too low.
    command: ["postgres", "-c", "maintenance_work_mem=512MB"]
    environment:
      POSTGRES_DB: django
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "postgres"]
      start_period: 30s
      start_interval: 2s
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql

  elasticsearch:
    image: elasticsearch:9.5.5
    environment:
      ES_JAVA_OPTS: "-Xms250m -Xmx750m"
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: elastic
      cluster.routing.allocation.disk.threshold_enabled: "false"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--user", "elastic:elastic", "--silent", "http://localhost:9200/"]
      start_period: 30s
      start_interval: 2s
    ports:
      - 9200:9200
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      start_period: 30s
      start_interval: 2s
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq:/var/lib/rabbitmq

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    environment:
      AWS_ACCESS_KEY_ID: seaweedAccessKey
      AWS_SECRET_ACCESS_KEY: seaweedSecretKey
      WEED_ADMIN_USER: seaweedAdmin
      WEED_ADMIN_PASSWORD: seaweedAdminPassword
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8333/healthz"]
      start_period: 30s
      start_interval: 2s
    ports:
      - 8333:8333
      - 12535:12535
    volumes:
      - seaweedfs:/data

  redis:
    image: redis:8.10.3-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 30s
      start_interval: 2s
    ports:
      - 6379:6379
    volumes:
      - redis:/data

volumes:
  postgres:
  elasticsearch:
  rabbitmq:
  redis:
  seaweedfs:
