<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISIC benchmarks</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  <script src="data.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    nav { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; font-size: 0.875rem; }
    .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(32rem, 100%), 1fr)); gap: 2rem; }
    .charts > div { position: relative; display: flex; flex-direction: column; height: 24rem; padding: 0.75rem; border-radius: 0.5rem; --bg: #fff; }
    .charts h3 { margin: 0 3rem 0.5rem; font: bold 12px system-ui, sans-serif; color: #666; text-align: center; }
    .charts button { position: absolute; top: 0.75rem; right: 0.75rem; padding: 0; border: 0; background: none; font: 12px system-ui, sans-serif; color: #666; cursor: pointer; }
    .charts button:hover { text-decoration: underline; }
    .charts .chart { position: relative; flex: 1; min-height: 0; }
    .charts .table { display: none; flex: 1; min-height: 0; overflow: auto; font-size: 12px; }
    .charts .as-table .chart { display: none; }
    .charts .as-table .table { display: block; }
    .charts table { border-collapse: collapse; white-space: nowrap; }
    .charts th, .charts td { padding: 0.15rem 0.5rem; text-align: right; }
    .charts th { position: sticky; top: 0; background: var(--bg); }
    .charts th:first-child, .charts td:first-child { position: sticky; left: 0; background: var(--bg); }
    .charts th:first-child { z-index: 1; }
    .charts th:nth-child(-n+2), .charts td:nth-child(-n+2) { text-align: left; }
    .charts td small { display: inline-block; min-width: 2.75em; margin-left: 0.35rem; text-align: right; color: #999; }
    .charts td small.worse { color: #c62828; }
    .charts td small.better { color: #2e7d32; }
    .charts td.worse { background: #ffe0dc; }
    .charts td.better { background: #dcf5e6; }
    .charts > div[hidden] { display: none; }
    .memory { background: #f3eefc; --bg: #f3eefc; }
    nav input[type="range"] { display: block; width: 6rem; margin: 0; }
    @media (min-width: 48rem) {
      body { margin: 2rem 2rem 2rem 10rem; }
      nav { position: fixed; top: 2rem; left: 2rem; flex-direction: column; }
      nav label + a { margin-top: 0.75rem; }
      .charts > div { height: 18rem; }
    }
  </style>
</head>
<body>
  <h1>ISIC benchmarks</h1>
  <nav>
    <label><input type="checkbox" checked> Timing</label>
    <label title="Hide timing charts whose latest value is below this"><input type="range" min="0" value="0"> <output>all</output></label>
    <label><input type="checkbox" checked> Memory</label>
  </nav>
  <script>
    const { repoUrl, lastUpdate, entries } = window.BENCHMARK_DATA;
    const runs = entries.Benchmark;
    document.body.insertAdjacentHTML(
      "beforeend",
      `<p><a href="${repoUrl}">${repoUrl}</a> &middot; Last updated ${new Date(lastUpdate).toLocaleString()}</p>`,
    );
    // Colorblind-safe in this order. Charts with more lines reuse them dashed.
    const colors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"];
    const number = new Intl.NumberFormat(undefined, { maximumSignificantDigits: 3 });
    const percent = new Intl.NumberFormat(undefined, { style: "percent", signDisplay: "exceptZero", maximumFractionDigits: 0 });
    // Matches THRESHOLD in history.py: `history.py check` fails the benchmark job in CI when a
    // benchmark grows by more than this over the run before it.
    const THRESHOLD = 1.5;
    // Changes smaller than this are within the noise between runs.
    const NOISE = 1.05;
    const tooltipColors = { worse: "#ff8a80", better: "#69f0ae", "": "#fff" };

    // GitHub merge commits put the PR title on the third line.
    function commitSubject(message) {
      const [subject, , body] = message.split("\n");
      const pr = subject.match(/^Merge pull request (#\d+)/)?.[1];
      return pr && body ? `${pr} ${body}` : subject;
    }

    // Chart.js doesn't wrap tooltip text, so long lines run off narrow charts.
    function wrap(text, width) {
      return text.match(new RegExp(`.{1,${width}}(?:\\s|$)|\\S+`, "g")).map((line) => line.trim());
    }

    // The tooltip shows for the nearest run, but clicking through to its commit needs a hit on a point.
    function runAt(event, chart) {
      return runs[chart.getElementsAtEventForMode(event, "nearest", { intersect: true }, false)[0]?.index];
    }

    const byName = runs.map((run) => Object.fromEntries(run.benches.map((bench) => [bench.name, bench.value])));

    // A benchmark's value over its value in the run before, or undefined when either is missing.
    function ratio(i, name) {
      const previous = byName[i - 1]?.[name];
      return previous && name in byName[i] ? byName[i][name] / previous : undefined;
    }

    function verdict(ratio, threshold = THRESHOLD) {
      if (ratio > threshold) {
        return "worse";
      }
      if (ratio < 1 / threshold) {
        return "better";
      }
      return "";
    }

    function escape(text) {
      return text.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    }

    function table(lines, unit) {
      const entries = Object.entries(lines);
      const rows = runs.map(({ commit }, i) => {
        const cells = entries.map(([, { name, values }]) => {
          if (values[i] === null) {
            return "<td></td>";
          }
          const r = ratio(i, name);
          const change = r === undefined ? "" : `<small class="${verdict(r, NOISE)}">${percent.format(r - 1)}</small>`;
          return `<td class="${verdict(r)}">${number.format(values[i])}${change}</td>`;
        });
        const link = `<a href="${commit.url}" title="${escape(commitSubject(commit.message))}">${commit.id.slice(0, 7)}</a>`;
        return `<tr><td>${link}</td><td>${new Date(commit.timestamp).toLocaleDateString()}</td>${cells.join("")}</tr>`;
      });
      const head = entries.map(([label]) => `<th>${label} (${unit})</th>`);
      return `<table><thead><tr><th>Commit</th><th>Date</th>${head.join("")}</tr></thead><tbody>${rows.reverse().join("")}</tbody></table>`;
    }

    const groups = {};
    runs.forEach((run, i) => {
      for (const bench of run.benches) {
        const [, module, test, param, memory = ""] = bench.name.match(
          /^benchmarks\/test_(\w+)\.py::(\w+)(?:\[(.*)\])?( peak memory)?$/,
        );
        groups[module] ??= {};
        const chart = (groups[module][test + memory] ??= { unit: bench.unit, lines: {} });
        const line = (chart.lines[param ?? test] ??= { name: bench.name, values: Array(runs.length).fill(null) });
        line.values[i] = bench.value;
      }
    });

    // A chart with more lines than colors splits into one chart per leading parameter.
    for (const charts of Object.values(groups)) {
      for (const [title, { unit, lines }] of Object.entries(charts)) {
        if (Object.keys(lines).length > colors.length) {
          delete charts[title];
          for (const [param, line] of Object.entries(lines)) {
            const [, prefix, rest] = param.match(/^(.*)-(.*?)$/);
            (charts[`${title} (${prefix})`] ??= { unit, lines: {} }).lines[rest] = line;
          }
        }
      }
    }

    for (const module of Object.keys(groups).sort()) {
      document.querySelector("nav").insertAdjacentHTML("beforeend", `<a href="#${module}">${module}</a>`);
      document.body.insertAdjacentHTML(
        "beforeend",
        `<section><h2 id="${module}">${module}</h2><div class="charts"></div></section>`,
      );
      const grid = document.body.lastElementChild.lastElementChild;
      const charts = Object.entries(groups[module]).sort(
        ([a, x], [b, y]) => (x.unit === "MiB") - (y.unit === "MiB") || a.localeCompare(b),
      );
      for (const [title, { unit, lines }] of charts) {
        const cell = grid.appendChild(document.createElement("div"));
        cell.className = unit === "MiB" ? "memory" : "time";
        cell.dataset.latest = Math.max(...Object.values(lines).map(({ values }) => values.findLast((v) => v !== null)));
        cell.insertAdjacentHTML(
          "beforeend",
          `<h3>${title}</h3><button type="button">table</button><div class="chart"></div><div class="table">${table(lines, unit)}</div>`,
        );
        cell.querySelector("button").onclick = (event) => {
          event.target.textContent = cell.classList.toggle("as-table") ? "chart" : "table";
        };
        const canvas = cell.querySelector(".chart").appendChild(document.createElement("canvas"));
        new Chart(canvas, {
          type: "line",
          data: {
            labels: runs.map((run) => run.commit.id.slice(0, 7)),
            datasets: Object.entries(lines).map(([label, { name, values }], i) => ({
              label,
              name,
              data: values,
              borderColor: colors[i % colors.length],
              backgroundColor: colors[i % colors.length],
              borderDash: i < colors.length ? [] : [6, 4],
            })),
          },
          options: {
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            onHover: (event, elements, chart) => (chart.canvas.style.cursor = runAt(event, chart) ? "pointer" : "default"),
            onClick: (event, elements, chart) => {
              const run = runAt(event, chart);
              if (run) {
                window.open(run.commit.url);
              }
            },
            plugins: {
              tooltip: {
                itemSort: (a, b) => b.parsed.y - a.parsed.y,
                callbacks: {
                  title: ([item]) => {
                    const { id, message, timestamp } = runs[item.dataIndex].commit;
                    // About 8px per character of the bold 12px title font
                    return [
                      ...wrap(commitSubject(message), Math.floor(item.chart.width / 8)),
                      `${id.slice(0, 7)} · ${new Date(timestamp).toLocaleDateString()}`,
                    ];
                  },
                  label: (item) => {
                    const r = ratio(item.dataIndex, item.dataset.name);
                    const change = r === undefined ? "" : ` (${percent.format(r - 1)})`;
                    return `${item.dataset.label}: ${number.format(item.parsed.y)} ${unit}${change}`;
                  },
                  labelTextColor: (item) => tooltipColors[verdict(ratio(item.dataIndex, item.dataset.name))],
                  footer: ([item]) =>
                    item.dataIndex > 0 ? `Change since ${runs[item.dataIndex - 1].commit.id.slice(0, 7)}` : "",
                },
              },
            },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: unit } } },
          },
        });
      }
    }

    const nav = document.querySelector("nav");
    const [showTime, threshold, showMemory] = nav.querySelectorAll("input");
    // 1, 2, 5, 10, 20, ... up to the slowest benchmark, since timings span several orders of magnitude.
    const slowest = Math.max(...[...document.querySelectorAll(".time")].map((cell) => Number(cell.dataset.latest)));
    const thresholds = [0];
    for (let step = 1; step <= slowest; step *= 10) {
      thresholds.push(...[step, step * 2, step * 5].filter((ms) => ms <= slowest));
    }
    threshold.max = thresholds.length - 1;

    function filter() {
      const minimum = thresholds[threshold.value];
      threshold.disabled = !showTime.checked;
      threshold.nextElementSibling.textContent = minimum ? `≥ ${minimum} ms` : "all";
      for (const cell of document.querySelectorAll(".charts > div")) {
        cell.hidden = cell.classList.contains("memory")
          ? !showMemory.checked
          : !showTime.checked || Number(cell.dataset.latest) < minimum;
      }
      for (const section of document.querySelectorAll("section")) {
        section.hidden = !section.querySelector(".charts > div:not([hidden])");
      }
      for (const link of nav.querySelectorAll("a")) {
        link.hidden = document.getElementById(link.hash.slice(1)).closest("section").hidden;
      }
    }
    nav.oninput = filter;
    filter();
  </script>
</body>
</html>
